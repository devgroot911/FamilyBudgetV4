<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#173b37">
  <!-- Cache busting headers to prevent aggressive offline caching -->
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <meta name="description" content="Family Budget Cloud App">
  <link rel="stylesheet" href="styles.css?v=7">
  <title>Family Budget</title>
</head>
<body class="logged-out">
  <div class="app-shell">
    <aside class="sidebar">
      <div class="brand"><span class="brand-mark">FB</span><span><strong>Family Budget</strong><small>Cloud ledger</small></span></div>
      <nav id="main-nav" aria-label="Main navigation">
        <button class="nav-item active" data-view="dashboard"><span>📈</span> Overview</button>
        <button class="nav-item" data-view="expenses"><span>➕</span> Add expense</button>
        <button class="nav-item" data-view="records"><span>📁</span> Records</button>
        <button class="nav-item" data-view="allowances"><span>💰</span> Allowances</button>
        <button class="nav-item" data-view="items"><span>📋</span> Item catalog</button>
        <button class="nav-item" data-view="reports"><span>📄</span> Reports</button>
        <button class="nav-item" data-view="users" id="nav-users" style="display:none;"><span>👥</span> Manage Users</button>
      </nav>
      <div class="sidebar-footer"><span class="status-dot" style="background:var(--primary)"></span><span>Connected to Cloud</span></div>
    </aside>

    <main class="main-content">
      <header class="topbar">
        <div><p class="eyebrow" id="page-kicker">HOUSEHOLD LEDGER</p><h1 id="page-title">Overview</h1></div>
        <div class="top-actions">
          <button class="icon-button" id="language-button" title="Change language">EN</button>
          <button class="profile-chip" data-view="profile">
            <span id="profile-initials">FM</span>
            <span id="profile-name">Family member</span>
          </button>
          <button class="ghost-button" id="logout-button" title="Log Out" style="padding: 6px 12px;">Log Out</button>
        </div>
      </header>

      <div id="notice" class="notice" role="status"></div>
      
      <section id="view-login" class="view active">
        <div class="panel" style="max-width: 400px; margin: 0 auto;">
          <div class="section-heading" style="justify-content: center; text-align: center; margin-bottom: 25px;">
            <div><div class="brand-mark" style="margin: 0 auto 15px; width: 48px; height: 48px; font-size: 16px;">FB</div><h2>System Login</h2><small>Please sign in to access the system</small></div>
          </div>
          <form id="login-form">
            <div id="login-error" style="color: #d32f2f; margin-bottom: 15px; font-weight: 500; text-align: center; font-size: 14px; min-height: 20px;"></div>
            <div class="field">
              <label for="login-username">Username</label>
              <input id="login-username" required autocomplete="username">
            </div>
            <div class="field">
              <label for="login-password">Password</label>
              <input type="password" id="login-password" required autocomplete="current-password">
            </div>
            <button class="primary-button" type="submit" style="width: 100%; margin-top: 10px; padding: 12px;">Sign In</button>
          </form>
        </div>
      </section>

      <section id="view-dashboard" class="view"></section>
      <section id="view-expenses" class="view"></section>
      <section id="view-records" class="view"></section>
      <section id="view-allowances" class="view"></section>
      <section id="view-items" class="view"></section>
      <section id="view-reports" class="view"></section>
      <section id="view-profile" class="view"></section>
      <section id="view-users" class="view"></section>
    </main>
    </div>

  <!-- Hidden input for file restore -->
  <input type="file" id="backup-input" accept=".json,.csv" style="display:none">

  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <script src="app.js?v=17"></script>
</body>
</html>
